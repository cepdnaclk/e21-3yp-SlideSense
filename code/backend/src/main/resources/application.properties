spring.application.name=slidesense-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/slidesense}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:slidesense}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:slidesense}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

security.jwt.secret=${SECURITY_JWT_SECRET:slidesense-local-dev-secret-key-change-me-1234567890}
security.jwt.access-expiration-ms=${SECURITY_JWT_ACCESS_EXPIRATION_MS:900000}
security.jwt.refresh-expiration-ms=${SECURITY_JWT_REFRESH_EXPIRATION_MS:604800000}
security.api-key.header=${SECURITY_API_KEY_HEADER:X-API-Key}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
