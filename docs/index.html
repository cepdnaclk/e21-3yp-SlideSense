<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SlideSense | System Initializing</title>

    <link rel="stylesheet" href="./loadingStyle.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="background">

        <div class="grid"></div>

    </div>


    <!-- =========================================
         PARTICLES
    ========================================== -->

    <div id="particles"></div>


    <!-- =========================================
         TOP LEFT
    ========================================== -->

    <div class="network-status">

        <div class="network-icon">

            <div class="signal signal-1"></div>
            <div class="signal signal-2"></div>
            <div class="signal signal-3"></div>

            <div class="signal-dot"></div>

        </div>

        <div>

            <div class="network-title">
                SENSOR NETWORK
            </div>

            <div class="network-online">

                <span></span>

                ONLINE

            </div>

        </div>

    </div>





    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="main">


        <!-- LOGO -->

        <div class="logo">
            <img src="assets/logo.png" alt="SlideSense" class="logo-image">
        </div>


        <!-- TAGLINE -->

        <div class="tagline">

            AI-ENHANCED IOT LANDSLIDE MONITORING SYSTEM

        </div>


        <!-- RADAR -->

        <div class="radar">

            <div class="radar-ring ring-1"></div>

            <div class="radar-ring ring-2"></div>

            <div class="radar-ring ring-3"></div>

            <div class="radar-sweep"></div>

            <div class="radar-dot"></div>

        </div>


        <!-- LOADING -->

        <div id="loadingText" class="loading-text">

            LOADING SENSOR NETWORK...

        </div>


        <!-- PROGRESS -->

        <div class="progress-container">

            <div class="progress-background">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>

            <div
                id="progressNumber"
                class="progress-number">

                0%

            </div>

        </div>


        <div class="loading-description">

            Please wait while we prepare your real-time insights

        </div>


    </main>

    <script src="./loadingscript.js"></script>

</body>

</html>
